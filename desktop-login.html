<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HexStack 電腦版登入</title>
<link rel="icon" href="favicon.svg">
<style>
/* 電腦版 App 的 Google 登入頁：在系統瀏覽器打開，登入後把結果交回這台電腦上的 App（只送到 127.0.0.1） */
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a1d7a,#160b34 70%);color:#f3eeff;font:15px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
main{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px}
h1{font-size:24px;margin:0;letter-spacing:.02em}
p{margin:0;color:#cfc3f2;font-size:14px}
.hsG{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;font-weight:600;color:#f6efff;background:linear-gradient(135deg,rgba(168,120,255,.42),rgba(110,60,220,.28));border:1px solid rgba(220,190,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(90,40,200,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hsG:focus-visible{outline:2px solid #f6cf6a;outline-offset:3px}
.hsG svg{width:20px;height:20px;background:#fff;border-radius:50%;padding:3px}
.hsG[disabled]{opacity:.6;cursor:default}
#msg{min-height:1.6em}
.ok{color:#7fe0c0}.bad{color:#ff9a9a}
</style>
</head>
<body>
<main>
<svg width="88" height="88" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke-width="5" stroke-linejoin="round"><path d="M28 62h44l12 12-12 12H28L16 74z" stroke="#7a4cf0"/><path d="M28 44h44l12 12-12 12H28L16 56z" stroke="#c8a2ff"/><path d="M28 26h44l12 12-12 12H28L16 38z" stroke="#f6cf6a"/></g></svg>
<h1>登入 HexStack 電腦版</h1>
<p id="lead">用 Google 帳戶登入，登入完成後會自動回到電腦上的 HexStack。</p>
<button class="hsG" id="go" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>使用 Google 帳戶登入</button>
<p id="msg" role="status"></p>
</main>
<script>
(()=>{const GCID='191032419379-be7bgivr1u5o8ob8cn0hgnpl1hone268.apps.googleusercontent.com',BASE='https://hexstack-push.hexstack-df20e2.workers.dev';
  const q=new URLSearchParams(location.search),port=+q.get('p'),state=q.get('s')||'';
  const btn=document.getElementById('go'),msg=document.getElementById('msg'),say=(t,c)=>{msg.textContent=t;msg.className=c||''};
  // 只接受 App 給的本機連接埠和隨機碼，結果只送回這台電腦
  if(!(port>1024&&port<65536)||!/^[a-f0-9]{32}$/.test(state)){btn.disabled=true;say('請從電腦版 HexStack 按「使用 Google 帳戶登入」打開這一頁。','bad');return}
  const back=o=>{const u=new URL('http://127.0.0.1:'+port+'/done');u.searchParams.set('s',state);for(const k in o)u.searchParams.set(k,o[k]);location.href=u.href};
  let tc=null;const gis=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=ok;s.onerror=()=>no(new Error('載入 Google 登入失敗'));document.head.appendChild(s)});
  async function done(at){say('登入中…');btn.disabled=true;
    try{const r=await fetch(BASE+'/auth/google',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({access_token:at})});const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.token)throw new Error(j.error||'HTTP '+r.status);
      say('登入成功，正在回到 HexStack…','ok');document.getElementById('lead').textContent=j.email||'';back({t:j.token,e:j.email||''});
      setTimeout(()=>say('已登入。可以關掉這個分頁，回到 HexStack。','ok'),1500)}
    catch(e){btn.disabled=false;say('登入失敗：'+e.message,'bad')}}
  btn.onclick=()=>gis.then(()=>{if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:'openid email',callback:r=>r&&r.access_token?done(r.access_token):say('登入取消或失敗','bad'),error_callback:e=>say(e&&e.type==='popup_closed'?'':'登入視窗打不開，請允許這個網站的彈出視窗','bad')});tc.requestAccessToken({prompt:''})}).catch(e=>say(e.message,'bad'));
})();
</script>
</body>
</html>
