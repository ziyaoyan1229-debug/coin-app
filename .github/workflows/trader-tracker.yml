# 交易員追蹤（前瞻紀錄）：每 6 小時抓 tracker/watchlist.csv 名單上地址的 Hyperliquid 公開資料（持倉、權益、成交），
# 算實際槓桿（兩種分母）、部位變化、警報、自加入名單起的扣入出金報酬 vs 同期 BTC。
# 只用公開 info API，不需金鑰、不下單。資料推到 tracker-data 分支（一般 commit 一直累積，不 force push，不動 main、gh-pages、data）。
# 名單改法：在 main 的 tracker/watchlist.csv 追加一列（added_utc 填加入時間）；移除＝active 改 0，不刪列，保留選人紀錄。
name: trader-tracker
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trader-tracker
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tracker
          sparse-checkout-cone-mode: false
      - name: 取 tracker-data 分支（第一次沒有就建新的）
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$URL" tracker-data >/dev/null 2>&1; then
            git clone -q --depth 3 --branch tracker-data --single-branch "$URL" out
          else
            mkdir out && git -C out init -q -b tracker-data
          fi
      - name: 跑追蹤
        run: |
          pip install -q requests
          python3 tracker/run_tracker.py --watchlist tracker/watchlist.csv --out out
          cp tracker/watchlist.csv out/watchlist_at_run.csv
      - name: 推到 tracker-data 分支
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd out
          git config user.name 'github-actions[bot]'
          git config user.email '41898732+github-actions[bot]@users.noreply.github.com'
          printf '# 交易員追蹤資料（自動產生）\n\n由 main 的 .github/workflows/trader-tracker.yml 每 6 小時追加一個 commit（不覆蓋歷史）。\n說明見 main 的 tracker/README.md。最新摘要：summary.md；前瞻績效：forward.csv；警報：alerts.md。\n' > README.md
          git add -A
          git commit -q -m "追蹤快照 $(date -u '+%Y-%m-%d %H:%M') UTC" || { echo '沒有變化'; exit 0; }
          for i in 1 2 3 4; do git push -q "$URL" HEAD:tracker-data && exit 0; sleep $((i*5)); git pull -q --rebase "$URL" tracker-data || true; done
          exit 1
