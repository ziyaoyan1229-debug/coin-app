# 部署背景推播後端（worker/push.js）到 Cloudflare Workers 免費方案：iPhone 主畫面 App、Android、電腦，App 關著也收得到通知。
# 需要 GitHub secrets：CF_API_TOKEN（Cloudflare「Edit Cloudflare Workers」範本建的 API Token）、CF_ACCOUNT_ID。
# 發送用密鑰 PUSH_KEY：有設 secret 就用它，沒設就由 CF_API_TOKEN 算出（klines.yml 的 tg_notify.py 用同一個算法）。
# 改到 worker/ 時自動重新部署；手動執行可勾「發一則測試通知」給所有已開啟的裝置。
name: push
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/push.yml']
  workflow_dispatch:
    inputs:
      test:
        description: 部署後發一則測試通知
        type: boolean
        default: true
concurrency:
  group: push
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 部署到 Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PUSH_KEY_IN: ${{ secrets.PUSH_KEY }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo '還沒設定 CF_API_TOKEN／CF_ACCOUNT_ID，跳過'; exit 0; fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # KV：存裝置訂閱和 VAPID 金鑰，沒有就建一個
          ID=$(curl -fsS -H "$H" "$API/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="hexstack-push-subs") | .id' | head -1)
          if [ -z "$ID" ]; then ID=$(curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' -d '{"title":"hexstack-push-subs"}' "$API/storage/kv/namespaces" | jq -r .result.id); fi
          [ -n "$ID" ] && [ "$ID" != null ] || { echo '建 KV 失敗（API Token 權限要有 Workers KV Storage: Edit）'; exit 1; }
          # D1：帳號同步用的資料庫，沒有就建一個；API Token 沒有 D1 權限就先不綁（同步回 503，推播照常）
          DB=$(curl -sS -H "$H" "$API/d1/database?name=hexstack-sync" | jq -r '.result[]? | select(.name=="hexstack-sync") | .uuid' | head -1)
          if [ -z "$DB" ]; then R=$(curl -sS -X POST -H "$H" -H 'Content-Type: application/json' -d '{"name":"hexstack-sync"}' "$API/d1/database"); DB=$(echo "$R" | jq -r '.result.uuid // empty'); fi
          [ -n "$DB" ] || echo "::warning::建 D1 失敗（API Token 權限要加 D1: Edit），帳號同步先不開：$(echo "$R" | jq -c '.errors // .' | head -c 400)"
          # workers.dev 子網域：還沒註冊就用 hexstack-<帳號前 6 碼> 註冊一個（之後可在 Cloudflare 改）
          SUB=$(curl -fsS -H "$H" "$API/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$SUB" ]; then
            for N in hexstack "hexstack-${CLOUDFLARE_ACCOUNT_ID:0:6}" "hs-$CLOUDFLARE_ACCOUNT_ID"; do
              SUB=$(curl -sS -X PUT -H "$H" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$N\"}" "$API/workers/subdomain" | jq -r '.result.subdomain // empty')
              [ -n "$SUB" ] && break
            done
            [ -n "$SUB" ] || { echo '註冊 workers.dev 子網域失敗'; exit 1; }
            echo "已註冊 $SUB.workers.dev"
          fi
          cd worker
          # 排程每 5 分鐘：檢查執行器主機心跳，離線就推通知（免費方案可用）
          printf 'name = "hexstack-push"\nmain = "push.js"\ncompatibility_date = "2025-01-01"\nworkers_dev = true\n\n[triggers]\ncrons = ["*/5 * * * *"]\n\n[[kv_namespaces]]\nbinding = "SUBS"\nid = "%s"\n' "$ID" > wrangler.toml
          [ -n "$DB" ] && printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "hexstack-sync"\ndatabase_id = "%s"\n' "$DB" >> wrangler.toml
          npx -y wrangler@4 deploy
          KEY="${PUSH_KEY_IN:-$(printf '%s' "${CLOUDFLARE_API_TOKEN}hexstack-push" | sha256sum | cut -d' ' -f1)}"
          printf '%s' "$KEY" | npx -y wrangler@4 secret put PUSH_KEY
          URL="https://hexstack-push.$SUB.workers.dev"
          echo "推播後端：$URL"
          for i in $(seq 1 24); do curl -fsS "$URL/vapid" > /dev/null 2>&1 && { echo '後端正常'; break; }; sleep 10; done   # 新註冊的子網域要一點時間生效
          echo "已訂閱裝置：$(curl -sS -H "Authorization: Bearer $KEY" "$URL/stats")"
          if [ -n "$TEST" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
              -d '{"items":[{"title":"✅ HexStack 背景推播測試","body":"收到這則就代表 App 關著也能收到通知了。","url":"./#notify","tag":"hs-test"}]}' "$URL/send"; echo
          fi
