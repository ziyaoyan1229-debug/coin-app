# 每 15 分鐘抓 BTC、ETH 的 15 分／5 分 K 線、算 S-03 模擬盤（paper.json）、存市場分析歷史（news_history.json），推到 data 分支（單一 commit 覆蓋，不動 main 和 gh-pages）
name: klines
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: klines
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            news.json
          sparse-checkout-cone-mode: false
      - name: 抓 K 線
        run: python3 scripts/fetch_klines.py out/data
      - name: 算模擬盤（給網站「模擬盤」分頁；失敗不影響 K 線）
        continue-on-error: true
        run: |
          pip install -q pandas numpy
          git fetch -q --depth 1 origin data || true
          git show origin/data:data/s03_state.json > scripts/s03_state.json || true
          python3 scripts/paper.py out/data
          cp scripts/s03_state.json out/data/ || true
      - name: 存市場分析歷史（給網站「過去分析」；失敗不影響 K 線）
        continue-on-error: true
        run: |
          git show origin/data:data/news_history.json > old_hist.json 2>/dev/null || cp scripts/news_history_seed.json old_hist.json
          python3 scripts/news_history.py news.json out/data old_hist.json
      - name: 推到 data 分支
        run: |
          cd out
          git init -q -b data
          git config user.name 'github-actions[bot]'
          git config user.email '41898732+github-actions[bot]@users.noreply.github.com'
          printf '# K 線資料（自動產生）\n\n由 main 的 .github/workflows/klines.yml 每 15 分鐘覆蓋，只有一個 commit。\n欄位：open_time(ms, UTC), open, high, low, close, volume, taker_buy_base。來源 Binance 現貨 data-api.binance.vision，只含已收盤 K 棒。\n' > README.md
          git add -A
          git commit -q -m "K 線更新 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
